name: Deploy to Web

# Builds the web app once and ships it two ways (docs/web-deploy.md):
#
#   hosted       the `pages/` tree, published to Cloudflare Pages (Direct
#                Upload) and served at admin.invoicing.co. Its boot page names
#                https://invoicing.co as the API (`data-api-url`).
#   self-hosted  the `server/` tree, attached to this repo's GitHub Release as
#                invoiceninja-web-<version>.tar.gz: public/flutter/ and
#                resources/views/flutter/index.html (the app's boot page). The
#                backend's release workflow unpacks it into the server tarball;
#                no build is ever committed to invoiceninja/invoiceninja. (The
#                invoicing.co landing page is committed there instead, by
#                tools/web_deploy/export_landing.sh: hosted deploys with a git
#                pull. This workflow only renders it, as a check.)
#
# Modes: `test` builds both trees and runs every gate, publishing nothing.
# `preview` also deploys `pages/` to the Pages preview branch. `production`
# (Deploy to all only, on the release's tagged commit) deploys to the preview
# branch, checks what Pages serves there, then promotes to the production
# branch, and uploads the tarball. A `production` dispatch is the retry for a
# release whose web leg failed on this workflow's own checks: it runs from
# main and refuses unless everything the build reads is as the tag left it. Until the Pages project exists (repo
# variable CLOUDFLARE_PAGES_PROJECT, secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID), the Pages deploy is skipped with a notice.
#
# Three jobs, so neither shipment can hold up the other: `deploy-web` builds
# and checks the self-hosted side and hands both trees on as artifacts;
# `pages` checks and publishes the hosted tree; `attach` uploads the tarball
# (production only, and the only job with write access).
#
# Shaped like the store workflows (test/lint/deploy_all_workflow_test.dart):
# skip_tests on workflow_call only, a `test` job, and one job that needs it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: test builds and checks only; preview also deploys to the Pages preview branch; production retries a released version's web leg.
        type: choice
        options: [test, preview, production]
        default: test
  workflow_call:
    inputs:
      skip_tests:
        description: Set only by deploy-all.yml, whose release job already ran _test.yaml.
        type: boolean
        default: false
      mode:
        description: test, preview or production (production uploads the release tarball).
        type: string
        default: test

permissions:
  contents: read

# Never `deploy-all` (the caller's group): a caller and a callee in one group
# deadlock. A second dispatch waits for the first instead of cancelling it.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  test:
    # Skipped only under deploy-all.yml (skip_tests), whose release ran it once.
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/_test.yaml

  deploy-web:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    name: Build, check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.prep.outputs.version }}
      tarball: ${{ steps.tarball.outputs.name }}
    env:
      MODE: ${{ inputs.mode || 'test' }}
      API_URL: https://invoicing.co
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      # Default credentials (see the store workflows): the repo's stray
      # .dart_skills gitlinks fail checkout's submodule walk otherwise.
      - uses: actions/checkout@v5

      - name: Check the mode
        run: |
          case "$MODE" in
            test|preview|production) ;;
            *) echo "::error::Unknown mode '$MODE' (test, preview or production)."; exit 1 ;;
          esac

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      # One FOSS build serves hosted and self-hosted: nothing in store_services
      # runs on web, and self-hosted stays free of store SDKs as admin-portal's
      # main.foss.dart.js was. --web skips the native-only steps.
      - name: Use the FOSS dependency graph
        run: tools/prepare_foss.sh --web

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # --pwa-strategy=none: no service worker at all (the boot page clears the
      # old app's). --no-web-resources-cdn: the engine is served from our folder.
      - name: Build web
        run: flutter build web --wasm --release --no-web-resources-cdn --pwa-strategy=none

      - name: Cache-bust, build.json, version
        id: prep
        run: |
          set -euo pipefail
          tools/stamp_web_cache_bust.sh build/web >/dev/null
          # As appimage.yml makes the tag: 5.1.4+7 -> 5.1.4, quotes, spaces and
          # a trailing CR dropped.
          raw="$(grep -m1 '^version:' pubspec.yaml)"
          full="${raw#*version:}"; full="${full//[\"\' ]/}"; full="${full%$'\r'}"
          version="${full%%+*}"
          jq -n --arg version "$full" --arg sha "$GITHUB_SHA" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, sha: $sha, run_url: $run_url, built_at: $built_at}' \
            > build/web/build.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bootstrap_hash=$(sha256sum build/web/flutter_bootstrap.js | cut -c1-12)" >> "$GITHUB_OUTPUT"
          # The self-hosted build's folder, public/flutter/<id>/: a hash of every file, so any change
          # moves every URL the app loads and the server needs no cache rules.
          echo "build_id=$(cd build/web && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # The tarball names the release, so production only ships what the
      # release tagged (appimage.yml creates v<version> from pubspec): that
      # commit, or a later one that differs from it only in this workflow, its
      # checkers, the docs and the tests. That second case is the retry after
      # a fix to a gate here (a production dispatch on main).
      - name: Production ships the tagged build only
        if: env.MODE == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.prep.outputs.version }}"
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null || true)"
          if [ -z "$tagged" ]; then
            echo "::error::$tag does not exist. Production runs only after the release."
            exit 1
          fi
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$tagged"
            changed="$(git diff --name-only "$tagged" "$GITHUB_SHA" -- . \
              ':(exclude).github' ':(exclude)docs' ':(exclude)test' \
              ':(exclude)tools/web_deploy/check_served_files.py' \
              ':(exclude)tools/web_deploy/check_server_tarball.sh' \
              ':(exclude)tools/web_deploy/smoke_webdriver.sh' \
              ':(exclude)tools/web_deploy/split_main_js.py')"
            if [ -n "$changed" ]; then
              echo "::error::$tag is $tagged and this commit ($GITHUB_SHA) builds something else. Changed since the tag:"
              echo "$changed"
              exit 1
            fi
            echo "::notice::$tag is $tagged; this commit differs from it only in the workflow, its checkers, docs and tests."
          fi

      - name: Assemble the two trees
        run: |
          set -euo pipefail
          v="${{ steps.prep.outputs.bootstrap_hash }}"
          id="${{ steps.prep.outputs.build_id }}"
          excludes=(--exclude /index.html --exclude /flutter_service_worker.js
                    --exclude /drift_worker.dart --exclude /.last_build_id --exclude '*.symbols')

          # Self-hosted: the build under public/flutter/<id>/ with the server's
          # boot page, plain HTML whose __IN_*__ tokens the backend fills: nothing
          # in the tarball is compiled or run on a server. The page's base href
          # names the folder, so each build's URLs are new. The installed PWA's
          # start_url and scope are the site root, two levels up.
          mkdir -p "server/public/flutter/$id" server/resources/views/flutter
          rsync -a "${excludes[@]}" build/web/ "server/public/flutter/$id/"
          jq '.start_url = "../../" | .scope = "../../"' build/web/manifest.json > "server/public/flutter/$id/manifest.json"
          python3 tools/web_deploy/render_boot_page.py --server --version "$v" --build-id "$id" \
            -o server/resources/views/flutter/index.html
          # The invoicing.co landing page, rendered only to check apps.json: the
          # backend commits its copy (tools/web_deploy/export_landing.sh).
          python3 tools/web_deploy/render_landing.py --assets-base /landing/ \
            --assets-dir landing-check/public/landing -o landing-check/index.html
          # Nothing else notices when the backend's copy falls behind (a store
          # link switched, a minimum OS bumped): say so, without failing.
          committed=https://raw.githubusercontent.com/invoiceninja/invoiceninja/v5-develop/resources/views/landing/index.html
          if curl -fsSL "$committed" -o landing-check/committed.html; then
            cmp -s landing-check/index.html landing-check/committed.html \
              || echo "::warning::The landing page in invoiceninja/invoiceninja (v5-develop) differs from this one. Run tools/web_deploy/export_landing.sh and open a backend PR."
          else
            echo "::notice::No landing page in invoiceninja/invoiceninja v5-develop to compare with yet."
          fi

          # Hosted: the build at the root of the Pages site, its static boot page
          # naming the API, a 404 page (Pages would otherwise answer a missing
          # file with index.html and a 200) and _headers.
          mkdir -p pages
          rsync -a "${excludes[@]}" build/web/ pages/
          jq '.start_url = "./" | .scope = "./"' build/web/manifest.json > pages/manifest.json
          python3 tools/web_deploy/render_boot_page.py --static --hosted --base-href / \
            --api-url "$API_URL" --version "$v" -o pages/index.html
          cp tools/web_deploy/pages/404.html tools/web_deploy/pages/_headers pages/

          # Local roots for the gates: site/ is the self-hosted page as a server
          # renders it, standalone.html the same page without data-served (so a
          # local copy keeps the server field), and smoke-js/ the same tree with
          # the bootstrap forced to dart2js (canvaskit), which rules out skwasm.
          mkdir -p site smoke-js
          cp -a server/public/flutter site/flutter
          python3 tools/web_deploy/render_boot_page.py --static --base-href "/flutter/$id/" --version "$v" -o site/index.html
          python3 tools/web_deploy/render_boot_page.py --static --standalone --base-href "/flutter/$id/" --version "$v" -o site/standalone.html
          cp tools/web_deploy/serve.py site/serve.py
          cp -al site/flutter smoke-js/flutter
          cp site/index.html smoke-js/index.html
          rm "smoke-js/flutter/$id/flutter_bootstrap.js"
          # web/flutter_bootstrap.js keeps its load call on one line for this
          # (test/lint/web_bootstrap_wasm_test.dart holds the two in step).
          sed 's/_flutter\.loader\.load({config: {/_flutter.loader.load({config: {renderer: "canvaskit", /' \
            "site/flutter/$id/flutter_bootstrap.js" > "smoke-js/flutter/$id/flutter_bootstrap.js"
          grep -q 'renderer: "canvaskit"' "smoke-js/flutter/$id/flutter_bootstrap.js"

      - name: Served-files gate (self-hosted)
        run: |
          set -euo pipefail
          python3 tools/web_deploy/serve.py site 8000 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          python3 tools/web_deploy/check_served_files.py site http://127.0.0.1:8000 \
            --build "flutter/${{ steps.prep.outputs.build_id }}" | tee files-gate.txt

      # A hard gate. If headless WebGL proves flaky on the runner, add
      # `continue-on-error: true` here and the summary says so.
      - name: Boot smoke (self-hosted, WASM and dart2js)
        run: |
          set -euo pipefail
          python3 tools/web_deploy/serve.py site 8001 &
          wasm_server=$!
          python3 tools/web_deploy/serve.py smoke-js 8002 &
          js_server=$!
          trap 'kill $wasm_server $js_server' EXIT
          sleep 1
          tools/web_deploy/smoke_webdriver.sh http://127.0.0.1:8001/ 120 | tee smoke-wasm.txt
          CHROMEDRIVER_PORT=9516 tools/web_deploy/smoke_webdriver.sh http://127.0.0.1:8002/ 120 | tee smoke-js.txt

      - name: Package the self-hosted tarball
        id: tarball
        run: |
          set -euo pipefail
          name="invoiceninja-web-${{ steps.prep.outputs.version }}.tar.gz"
          tar -czf "$name" -C server public resources
          # What the backend checks before it unpacks this; fail here, not there.
          tools/web_deploy/check_server_tarball.sh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$name" | cut -f1)" >> "$GITHUB_OUTPUT"

      # Handed to the `pages` and `attach` jobs, and kept for a look.
      - name: Upload the hosted tree
        uses: actions/upload-artifact@v4
        with:
          name: web-pages
          path: pages/
          retention-days: 7

      - name: Upload the self-hosted tarball
        uses: actions/upload-artifact@v4
        with:
          name: web-tarball
          path: ${{ steps.tarball.outputs.name }}
          retention-days: 7

      - name: Upload the self-hosted site
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-staged
          path: site/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          gz() { [ -f "$1" ] && gzip -9c "$1" | wc -c | awk '{printf "%.1f MB", $1/1048576}' || echo "n/a"; }
          {
            echo "## Deploy to Web: $MODE (build and self-hosted)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| App | ${{ steps.prep.outputs.version }} at \`${GITHUB_SHA:0:8}\` |"
            echo "| Self-hosted tarball | ${{ steps.tarball.outputs.name }} (${{ steps.tarball.outputs.size }}) |"
            echo "| Download (gzip) | main.dart.wasm $(gz build/web/main.dart.wasm), main.dart.js $(gz build/web/main.dart.js) |"
            echo "| Served-files gate | $(tail -1 files-gate.txt 2>/dev/null || echo 'did not run') |"
            echo "| Boot smoke | WASM: $(head -1 smoke-wasm.txt 2>/dev/null || echo 'did not run'); dart2js: $(head -1 smoke-js.txt 2>/dev/null || echo 'did not run') |"
            echo
            echo "Try it locally (standalone.html has the usual server field, so it can sign in to the demo server):"
            echo
            echo '```'
            echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n web-staged -D web-staged"
            echo "cd web-staged/site && python3 serve.py ."
            echo '# open http://127.0.0.1:8000/standalone.html'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The hosted app: checked locally, then deployed and checked again where
  # Pages serves it. In production the check runs on a preview deployment,
  # before production is touched.
  pages:
    needs: [test, deploy-web]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.deploy-web.result == 'success' }}
    name: Hosted (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'test' }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: web-pages
          path: pages

      # Pages refuses any file over 25 MiB, and main.dart.js (the dart2js build
      # Firefox and Safari load) passed it on Flutter 3.50: 26.0 MiB on 5.1.27.
      # So here, and only here, it ships in parts behind a short loader; the
      # self-hosted tarball keeps the file whole (docs/web-deploy.md).
      - name: Split main.dart.js for Pages
        id: split
        run: |
          set -euo pipefail
          python3 tools/web_deploy/split_main_js.py pages | tee split.txt

      - name: Size gate (25 MiB a file)
        id: size
        run: |
          set -euo pipefail
          largest="$(find pages -type f -printf '%s %p\n' | sort -nr | head -1)"
          echo "largest=$(awk '{printf "%.1f MiB %s", $1/1048576, $2}' <<<"$largest")" >> "$GITHUB_OUTPUT"
          over="$(find pages -type f -size +25M)"
          if [ -n "$over" ]; then
            echo "::error::Over Cloudflare Pages' 25 MiB per-file limit:"; echo "$over"; exit 1
          fi

      # smoke-js/ is the same tree with the bootstrap forced to dart2js, as in
      # the self-hosted smoke: Chrome would otherwise never load main.dart.js,
      # and the loader the split leaves there is what this has to prove.
      - name: Served-files gate and boot smoke (local)
        run: |
          set -euo pipefail
          cp -al pages smoke-js
          rm smoke-js/flutter_bootstrap.js
          sed 's/_flutter\.loader\.load({config: {/_flutter.loader.load({config: {renderer: "canvaskit", /' \
            pages/flutter_bootstrap.js > smoke-js/flutter_bootstrap.js
          grep -q 'renderer: "canvaskit"' smoke-js/flutter_bootstrap.js
          python3 tools/web_deploy/serve.py pages 8003 &
          server=$!
          python3 tools/web_deploy/serve.py smoke-js 8004 &
          js_server=$!
          trap 'kill $server $js_server' EXIT
          sleep 1
          python3 tools/web_deploy/check_served_files.py pages http://127.0.0.1:8003 --build . | tee files-gate.txt
          tools/web_deploy/smoke_webdriver.sh http://127.0.0.1:8003/ 120 | tee smoke.txt
          CHROMEDRIVER_PORT=9516 tools/web_deploy/smoke_webdriver.sh http://127.0.0.1:8004/ 120 | tee smoke-js.txt

      - name: Deploy to the preview branch
        id: preview
        if: env.MODE != 'test' && env.PAGES_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages --project-name=${{ env.PAGES_PROJECT }} --branch=preview --commit-hash=${{ github.sha }}

      # What Pages actually serves: its types, and that a file that exists is
      # not answered by a fallback.
      - name: Served-files gate on the preview deployment
        if: steps.preview.outcome == 'success'
        run: python3 tools/web_deploy/check_served_files.py pages "${{ steps.preview.outputs.deployment-url }}" --build . | tee files-gate-deployed.txt

      # Every file is already uploaded, so this second deploy only points the
      # production branch at them.
      - name: Promote to production
        id: production
        if: env.MODE == 'production' && steps.preview.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

      - name: No Pages project yet
        if: env.MODE != 'test' && env.PAGES_PROJECT == ''
        run: echo "::notice::Pages deploy skipped. Set the CLOUDFLARE_PAGES_PROJECT variable and the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/store-deployment-setup.md)."

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Deploy to Web: $MODE (hosted)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| main.dart.js | $(tail -1 split.txt 2>/dev/null || echo 'did not run') |"
            echo "| Largest file (25 MiB limit) | ${{ steps.size.outputs.largest }} |"
            echo "| Served-files gate | local: $(tail -1 files-gate.txt 2>/dev/null || echo 'did not run'); preview deployment: $(tail -1 files-gate-deployed.txt 2>/dev/null || echo 'not deployed') |"
            echo "| Boot smoke | WASM: $(head -1 smoke.txt 2>/dev/null || echo 'did not run'); dart2js: $(head -1 smoke-js.txt 2>/dev/null || echo 'did not run') |"
            echo "| Preview | ${{ steps.preview.outputs.deployment-url || 'not deployed' }} |"
            echo "| Production | ${{ steps.production.outputs.deployment-url || 'not deployed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The self-hosted tarball onto the release, whatever happens to Pages.
  attach:
    needs: [test, deploy-web]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.deploy-web.result == 'success' && inputs.mode == 'production' }}
    name: Attach the tarball to the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job with write access; Deploy to all grants it on the web leg.
    permissions:
      contents: write
      # The provenance attestation below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-tarball

      # The server's release (react_release.yml in invoiceninja/invoiceninja)
      # takes the tarball only with this: `gh attestation verify --repo
      # invoiceninja/app --cert-identity-regex` pinned to this web.yml on main
      # or a vX.Y.Z tag. The tarball is static files the server fills or serves
      # as they are, but they reach every self-hosted server, so a file merely
      # uploaded to the release under the right name must not be enough
      # (docs/web-deploy.md).
      - name: Attest the tarball's provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ needs.deploy-web.outputs.tarball }}

      - name: Upload to v${{ needs.deploy-web.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v${{ needs.deploy-web.outputs.version }}" "${{ needs.deploy-web.outputs.tarball }}" --clobber

      # The server's release (react_release.yml) takes the web app from the
      # latest release here, so Latest is only ever a release that carries one:
      # appimage.yml publishes without it, and this marks it. Never moved back
      # to an older version (a retry of an earlier release's web leg).
      - name: Mark the release Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.deploy-web.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ "$latest" = "$tag" ]; then
            echo "$tag is already Latest."
          elif [ "$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::notice::$latest is Latest and newer than $tag: left as it is."
          else
            id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id)"
            gh api -X PATCH "repos/$GH_REPO/releases/$id" -f make_latest=true >/dev/null
            test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$tag"
            echo "$tag is now Latest (was ${latest:-none})."
          fi
